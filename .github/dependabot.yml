# 보안 업데이트만 켠다. 정기 버전 업데이트는 끈다.
#
# open-pull-requests-limit: 0 이 정기 버전 업데이트를 비활성화한다.
# 보안 업데이트는 이 설정과 무관하게 계속 동작하며, 아래의 commit-message·labels를
# 그대로 사용한다. 2인 팀에 매주 의존성 PR이 쌓이면 아무도 안 보게 되므로,
# "취약점이 발견됐을 때만" 알림이 오게 한다.
#
# 왜 commit-message를 지정하나: 기본 메시지는 "Bump next from 16.3.2 to 16.3.3"이라
# Conventional Commits가 아니다. 그대로 두면 commitlint CI가 막아서 보안 PR을
# 영원히 머지할 수 없다. 규칙은 docs/conventions.md 참조.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: scope
    labels:
      - dependencies
      - security
